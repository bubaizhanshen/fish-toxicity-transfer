[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-growth-qsar"
version = "0.2.0"
description = "Mortality QSAR transfer for fish growth NOEC prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
source = ["scipy>=1.13,<2", "scikit-learn>=1.6,<1.8", "lightgbm>=4.6,<5"]

[project.scripts]
fish-growth = "fish_growth_qsar.predict:main"
fish-growth-external = "fish_growth_qsar.external:main"
fish-growth-baselines = "fish_growth_qsar.baselines:main"

[tool.setuptools.packages.find]
where = ["src"]
